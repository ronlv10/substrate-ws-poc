#
# The WS-PoC egress broker: an always-on service that owns the persistent
# Slack Socket Mode connection on behalf of suspendable actors and serves the
# gRPC Session protocol to each actor's local proxy. Apply with `ko apply -f`
# so the ko:// image reference is built and pinned. No certs or DNS rewrites:
# actor-facing TLS lives in the actor image's local proxy.

apiVersion: v1
kind: Namespace
metadata:
  name: ws-poc

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-broker
  namespace: ws-poc

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-broker
  namespace: ws-poc
  labels:
    app: egress-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-broker
  template:
    metadata:
      labels:
        app: egress-broker
    spec:
      serviceAccountName: egress-broker
      containers:
      - name: broker
        image: ko://github.com/ronlv10/substrate-ws-poc/cmd/egress-broker
        args:
        - --grpc-listen=:9090
        - --dns-upstream=8.8.8.8:53
        - --ateapi-address=api.ate-system.svc:443
        ports:
        - name: grpc
          containerPort: 9090

---

apiVersion: v1
kind: Service
metadata:
  name: egress-broker
  namespace: ws-poc
  labels:
    app: egress-broker
spec:
  selector:
    app: egress-broker
  ports:
  - name: grpc
    port: 9090
    targetPort: 9090
