apiVersion: v1
kind: Namespace
metadata:
  name: ws-poc

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-broker
  namespace: ws-poc

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-broker
  namespace: ws-poc
  labels:
    app: egress-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-broker
  template:
    metadata:
      labels:
        app: egress-broker
    spec:
      serviceAccountName: egress-broker
      containers:
      - name: broker
        image: ko://github.com/ronlv10/substrate-ws-poc/cmd/egress-broker
        args:
        - --listen=:8443
        - --ateapi-address=api.ate-system.svc:443
        - --ca-cert=/etc/ws-poc/ca/tls.crt
        - --ca-key=/etc/ws-poc/ca/tls.key
        ports:
        - name: https
          containerPort: 8443
        volumeMounts:
        - name: broker-ca
          mountPath: /etc/ws-poc/ca
          readOnly: true
      volumes:
      - name: broker-ca
        secret:
          secretName: egress-broker-ca

---

apiVersion: v1
kind: Service
metadata:
  name: egress-broker
  namespace: ws-poc
  labels:
    app: egress-broker
spec:
  selector:
    app: egress-broker
  ports:
  # Actors dial slack.com:443 (and wss over 443); their /etc/hosts points those
  # hostnames here, and this Service forwards 443 to 8443 so the broker need not
  # run privileged.
  - name: https
    port: 443
    targetPort: 8443
