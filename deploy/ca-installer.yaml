#
# ca-installer publishes the actor CA bundle onto every node. It concatenates
# the container image's system CA bundle with the egress broker CA and writes
# the result to the shared ateom hostPath (/var/lib/ateom-gvisor), which both
# atelet and the worker pods mount. atelet is then pointed at this file via
# ATE_ACTOR_CA_BUNDLE and bind-mounts it into each actor sandbox (see
# cmd/atelet/oci.go), so actors trust the broker's minted certs while still
# trusting the real public CAs.

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ws-poc-ca-installer
  namespace: ws-poc
  labels:
    app: ws-poc-ca-installer
spec:
  selector:
    matchLabels:
      app: ws-poc-ca-installer
  template:
    metadata:
      labels:
        app: ws-poc-ca-installer
    spec:
      # Run wherever actors run (same nodes as atelet/worker pools).
      tolerations:
      - operator: Exists
      containers:
      - name: installer
        image: debian:stable-slim
        command:
        - /bin/sh
        - -c
        - |
          set -e
          OUT=/host-ateom/ws-poc-ca-certificates.crt
          SYS=/etc/ssl/certs/ca-certificates.crt
          publish() {
            : > "${OUT}.tmp"
            # Include the image's public roots when present so actors keep
            # trusting real CAs; always append the broker CA. (The echo actor
            # only needs the broker CA, so a missing system bundle is fine.)
            [ -f "$SYS" ] && cat "$SYS" >> "${OUT}.tmp"
            cat /ca/tls.crt >> "${OUT}.tmp"
            mv "${OUT}.tmp" "${OUT}"
          }
          echo "Publishing actor CA bundle to ${OUT} ..."
          publish
          echo "Done. Sleeping."
          # Keep the pod running so the file persists and is re-published if the
          # node's dir is recreated.
          while true; do
            [ -f "${OUT}" ] || publish
            sleep 3600
          done
        volumeMounts:
        - name: broker-ca
          mountPath: /ca
          readOnly: true
        - name: ateom-shared
          mountPath: /host-ateom
      volumes:
      - name: broker-ca
        secret:
          secretName: egress-broker-ca
      - name: ateom-shared
        hostPath:
          path: /var/lib/ateom-gvisor
          type: DirectoryOrCreate
